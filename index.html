<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#060D1A"/>
<meta name="description" content="מערכת ניהול טיפים - קופת טיפים מקצועית"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<title>קופת טיפים 🍕</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #060D1A;
    --surface: #0F172A;
    --border: #1E293B;
    --pink: #EC4899;
    --purple: #8B5CF6;
    --text: #F1F5F9;
    --muted: #475569;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html { overscroll-behavior: none; }

  body {
    background: var(--bg);
    font-family: 'Assistant', sans-serif;
    direction: rtl;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* Ambient glow */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .12;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 400px; height: 400px;
    background: var(--pink);
    top: -100px; right: -100px;
    animation: drift 8s ease-in-out infinite alternate;
  }
  body::after {
    width: 350px; height: 350px;
    background: var(--purple);
    bottom: -80px; left: -80px;
    animation: drift 10s ease-in-out infinite alternate-reverse;
  }
  @keyframes drift { to { transform: translate(30px, 20px); } }

  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 32px 24px;
    max-width: 360px;
    width: 100%;
  }

  .logo {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    margin: 0 auto 24px;
    box-shadow: 0 0 40px rgba(236,72,153,.3);
    animation: logoFloat 3s ease-in-out infinite;
  }
  @keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-6px); }
  }

  h1 {
    color: var(--text);
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 8px;
    letter-spacing: -.5px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 40px;
    line-height: 1.5;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 22px;
    border-radius: 20px;
    text-decoration: none;
    border: 1px solid var(--border);
    transition: transform .2s, box-shadow .2s, border-color .2s;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity .2s;
  }
  .card:active { transform: scale(.97); }
  .card:hover { transform: translateY(-2px); }

  .card-manager {
    background: linear-gradient(135deg, rgba(236,72,153,.15), rgba(139,92,246,.15));
    border-color: rgba(236,72,153,.3);
  }
  .card-manager::before { background: linear-gradient(135deg, var(--pink), var(--purple)); }
  .card-manager:hover { box-shadow: 0 8px 30px rgba(236,72,153,.25); border-color: rgba(236,72,153,.5); }

  .card-cashier {
    background: rgba(30,41,59,.6);
  }
  .card-cashier:hover { box-shadow: 0 8px 30px rgba(96,165,250,.15); border-color: #334155; }

  .card-icon {
    width: 52px; height: 52px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    flex-shrink: 0;
  }
  .card-manager .card-icon { background: linear-gradient(135deg, var(--pink), var(--purple)); }
  .card-cashier .card-icon { background: #1E293B; }

  .card-text { text-align: right; }
  .card-title { font-size: 17px; font-weight: 800; color: var(--text); margin-bottom: 3px; }
  .card-desc  { font-size: 12px; color: var(--muted); }

  .card-arrow {
    margin-right: auto;
    color: var(--muted);
    font-size: 18px;
    transition: transform .2s;
  }
  .card:hover .card-arrow { transform: translateX(-3px); }

  .version {
    margin-top: 32px;
    font-size: 11px;
    color: #1E293B;
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo">🍕</div>
  <h1>מערכת ניהול טיפים</h1>
  <p class="subtitle">בחר את סוג הכניסה שלך</p>

  <div class="cards">
    <a href="manager.html" class="card card-manager">
      <div class="card-icon">📊</div>
      <div class="card-text">
        <div class="card-title">כניסת מנהל</div>
        <div class="card-desc">ניהול עובדים, חלוקת טיפים, שכר</div>
      </div>
      <div class="card-arrow">‹</div>
    </a>

    <a href="cashier.html" class="card card-cashier">
      <div class="card-icon">💰</div>
      <div class="card-text">
        <div class="card-title">כניסת אחמש</div>
        <div class="card-desc">רישום קופות טיפים יומיות</div>
      </div>
      <div class="card-arrow">‹</div>
    </a>
  </div>

  <div class="version">v2.0 · קופת טיפים</div>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
// iOS standalone: keep navigation inside the app
if (window.navigator.standalone) {
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href]');
    if (a && !a.target && a.href.startsWith(location.origin)) {
      e.preventDefault();
      location.href = a.href;
    }
  });
}
</script>
</body>
</html>
